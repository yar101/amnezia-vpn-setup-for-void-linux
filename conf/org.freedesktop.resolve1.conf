<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Только root может владеть именем службы и отправлять управляющие вызовы DNS-мосту -->
  <policy user="root">
    <allow own="org.freedesktop.resolve1"/>
    <allow send_destination="org.freedesktop.resolve1"/>
    <allow receive_sender="org.freedesktop.resolve1"/>
  </policy>
  <!-- Запрет неавторизованным непривилегированным пользователям менять системный DNS -->
  <policy context="default">
    <deny send_destination="org.freedesktop.resolve1"/>
  </policy>
</busconfig>
